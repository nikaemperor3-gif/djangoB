<div class="table-wrap"><table><thead><tr><th>Usuário</th><th>Livro</th><th>Data</th><th>Status</th><th></th></tr></thead><tbody>
{% for emprestimo in emprestimos %}<tr><td class="primary-cell">{{ emprestimo.usuario.nome }}</td><td>{{ emprestimo.livro.nome }}</td><td>{{ emprestimo.data_emprestimo|date:'d/m/Y' }}</td><td><span class="badge badge-{{ emprestimo.status }}">{{ emprestimo.get_status_display }}</span></td><td><a class="row-action" href="{% url 'emprestimos:status' emprestimo.pk %}">Alterar status</a></td></tr>
{% empty %}<tr><td colspan="5" class="empty-state">Nenhum empréstimo registrado.</td></tr>{% endfor %}
</tbody></table></div>
